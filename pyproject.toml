[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldwide-tech-job-feed"
version = "0.1.0"
description = "Collect technology job listings and publish new vacancies to Discord."
requires-python = ">=3.10"
dependencies = [
  "feedparser>=6.0.11,<7",
  "PyYAML>=6.0.2,<7",
  "requests>=2.32.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
