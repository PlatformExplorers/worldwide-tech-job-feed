runtime:
  state_path: data/seen-hashes.json
  request_timeout_seconds: 20
  request_retries: 3
  max_posts_per_run: 3
  max_job_age_days: 30
  first_run_backfill: false

discord:
  # Set DISCORD_WEBHOOK_URL in the environment or GitHub Actions Secrets.
  retries: 4
  show_timestamp: true

sources:
  arbeitnow:
    # Disabled until the public redistribution terms are verified for your use case.
    enabled: false
    poll_interval_minutes: 60
    max_pages: 2
  jobicy:
    enabled: true
    poll_interval_minutes: 60
    count: 50
  remotive:
    # Credit Remotive and retain its listing links; no third-party job-board syndication.
    enabled: true
    poll_interval_minutes: 360
    request_retries: 0
    limit: 100
  himalayas:
    # Browse responses are cached for two hours; at most 100 listings per poll.
    enabled: true
    poll_interval_minutes: 120
    max_pages: 5
  greenhouse:
    enabled: false
    poll_interval_minutes: 60
    boards: []
    company_names: {}
  lever:
    enabled: false
    poll_interval_minutes: 60
    sites: []
    company_names: {}
  rss:
    enabled: false
    poll_interval_minutes: 60
    feeds: []

