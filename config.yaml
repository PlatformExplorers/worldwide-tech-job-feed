    - software engineer
    - software
    - developer
    - cybersecurity
    - cyber security
    - information security
    - penetration tester
    - security analyst
    - incident response
    - devops
    - devsecops
    - site reliability
    - cloud engineer
    - cloud support
    - data engineer
    - data scientist
    - data analyst
    - data analytics
    - machine learning
    - artificial intelligence
    - network engineer
    - system administrator
    - it support
    - technical support
    - database administrator
    - qa engineer
    - quality assurance
    - technology
    - software tester
    - frontend
    - back end
    - full stack
    - mobile developer
    - web developer
    - cloud computing
    - aws
    - azure
    - google cloud
    - information technology
    - information systems
    - computer science
    - computer engineering
    - solutions architect
    - robotics
    - embedded systems
    - blockchain
    - game developer
    - telecommunications
    - it infrastructure
    - technology internship
    - graduate technology
    - it intern
    - it internship
    - it graduate
    - it trainee
    - it analyst
    - junior it
  job_titles: []
  exclude_keywords:
    - unpaid
  countries: []
  remote_only: false

logging:
  level: INFO
