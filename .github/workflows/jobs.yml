name: Aggregate technology jobs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldwide-tech-job-feed
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out application
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore deduplication fingerprints
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          git_auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          state_ref="$(git -c http.https://github.com/.extraheader="$git_auth" \
            ls-remote --heads origin refs/heads/job-state)"
          if [ -n "$state_ref" ]; then
            git -c http.https://github.com/.extraheader="$git_auth" fetch origin \
              refs/heads/job-state:refs/remotes/origin/job-state
            if git cat-file -e origin/job-state:data/seen-hashes.json 2>/dev/null; then
              git checkout origin/job-state -- data/seen-hashes.json
            else
              echo "::warning::No fingerprint file found; source baselines will be re-established."
            fi
          fi

      - name: Aggregate and publish
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main --run

      - name: Save hashed deduplication state
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/seen-hashes.json ]; then
            echo "No deduplication state was produced; nothing to save."
            exit 0
          fi
          if git show-ref --verify --quiet refs/remotes/origin/job-state; then
            git worktree add "$RUNNER_TEMP/job-state" origin/job-state
          else
            git worktree add --orphan job-state "$RUNNER_TEMP/job-state"
          fi
          mkdir -p "$RUNNER_TEMP/job-state/data"
          cp data/seen-hashes.json "$RUNNER_TEMP/job-state/data/seen-hashes.json"
          cd "$RUNNER_TEMP/job-state"
          git rm -f --ignore-unmatch data/jobs.sqlite data/jobs.sqlite-wal data/jobs.sqlite-shm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen-hashes.json
          if ! git diff --cached --quiet; then
            git commit -m "Update deduplication fingerprints"
            git_auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="$git_auth" \
              push origin HEAD:refs/heads/job-state
          fi
